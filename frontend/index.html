<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿舍专属 - 端到端加密聊天</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="app">
        <!-- 登录/加入界面 -->
        <div id="join-screen" class="screen active">
            <div class="glass-panel">
                <div class="logo">🔒 DormChat</div>
                <h2>加入加密房间</h2>
                <p class="subtitle">所有消息将在你的设备上进行端到端加密，服务器无法查看内容。</p>
                <form id="join-form">
                    <div class="input-group">
                        <label for="username">你的名字</label>
                        <input type="text" id="username" placeholder="例如：张三" required>
                    </div>
                    <div class="input-group">
                        <label for="passphrase">房间密钥</label>
                        <input type="password" id="passphrase" placeholder="输入你们约定的密码" required>
                    </div>
                    <button type="submit" class="btn primary-btn">安全加入</button>
                </form>
            </div>
        </div>

        <!-- 聊天主界面 -->
        <div id="chat-screen" class="screen">
            <div class="chat-container glass-panel">
                <header class="chat-header">
                    <div class="header-info">
                        <h3>🔒 宿舍秘密基地</h3>
                        <span class="status"><span class="dot online"></span> 端到端加密已启用</span>
                    </div>
                    <button id="leave-btn" class="btn secondary-btn">退出</button>
                </header>
                
                <div class="messages-area" id="messages-area">
                    <!-- 消息将在这里渲染 -->
                    <div class="system-message">欢迎来到加密聊天室，输入的消息只有知道密钥的人才能看到。</div>
                </div>

                <form id="chat-form" class="chat-input-area">
                    <input type="text" id="message-input" placeholder="输入加密消息..." autocomplete="off" required>
                    <button type="submit" class="btn primary-btn send-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="crypto.js"></script>
    <script src="app.js"></script>
</body>
</html>
